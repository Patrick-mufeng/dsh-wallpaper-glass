# dsh-we-slim bundle patch — slimmed from dsh-wallpaper-glass@1.4.2
#
# 上游：https://github.com/elysia395/dsh-wallpaper-engine (MIT)
# 本发行版由使用方按「只保留在用的部分」裁成，行集与上游的差异见 README。
#
# ── 行集说明 ───────────────────────────────────────────────────────────────────
# 上游 1.4.2 共插 9 行；本版只保留 **4 行**：
#   · wallpaper-engine              —— 主包（扫描/服务壁纸 + 设置面板 + 样式层）
#   · wallpaper-engine-media-bridge —— 壁纸字节/库存/上传/场景族路由（27 条，壁纸本体）
#   · wallpaper-engine-glass        —— 液态玻璃渲染器与 CSS
#   · wallpaper-engine-fonts        —— 字体集与系统字体
#
# 已移除的 5 行及其原因（这些功能在本版被整块裁掉，对应 npm 包也不再是依赖）：
#   · wallpaper-engine-mascot-avatar —— 聊天吉祥物 / 会话头像（含拉绳挂件）
#   · wallpaper-engine-fx            —— 点击涟漪 / 拖尾特效
#   · wallpaper-engine-parallax      —— 3D 视差
#   · wallpaper-engine-pet-link      —— 桌宠联动（连带 20.3 MB 素材）
#   · wallpaper-engine-about-notice  —— 「关于」页签的 Star 数 / 群二维码
#
# ⚠️ 这 5 行必须**同时**从本文件删除，不能只从 dependencies 里删：
#    主包 apply() 的 assertSubpackagesResolvable 会按 patch 里的净新增行逐个 resolve，
#    解析不到就**大声抛错**（宿主对行级失败是静默的，所以上游故意做成硬失败）。
#    行与依赖两处必须一致 —— 要么都留，要么都删。
#
# ⚠️ 主包 `lib/index.js` 仍静态 import 了 about-notice / mascot-avatar / media-bridge
#    三个组件的 applyImpl（用于 applyComponent 分发点）。本版已把那两处 import 与
#    分发表项一并去掉，只留 media-bridge（见该文件头【精简改动】注释）。
#
# 恢复某个功能：把对应包的 dependencies 条目与下面一行加回来，并还原主包 applyComponent
# 分发表与客户端页签（PICKER_TABS）。详见 README 的「恢复」一节。

- insert:
    - id: wallpaper-engine
      name: 'dsh-wallpaper-glass'
    # 壁纸域路由族：/inventory、/media、/preview、/upload、/remove、/props、/slides、
    # /scene-* 等 —— 壁纸字节与库存的**唯一来源**，绝不可停。
    - id: wallpaper-engine-media-bridge
      name: 'dsh-wallpaper-glass-media-bridge'
    # 液态玻璃：ADR-0016 四刀之后整族随包走（渲染器 + CSS + 主题预设 UI）。
    # 停用本行 = 玻璃样式表与行为层整体退场，界面回到宿中原生外观（壁纸仍在）。
    - id: wallpaper-engine-glass
      name: 'dsh-wallpaper-glass-ui'
    # 字体系统：宿主半边（/fontsets、/system-fonts）+ 浏览器半边（外观页签「全局字体」）。
    # 字体的键、默认值与持久化仍住主包 lib/settings-schema.js（FONTSET_KEYS）。
    - id: wallpaper-engine-fonts
      name: 'dsh-wallpaper-glass-fonts'
